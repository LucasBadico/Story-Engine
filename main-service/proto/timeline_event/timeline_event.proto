syntax = "proto3";
package timeline_event;
option go_package = "github.com/story-engine/main-service/proto/timeline_event";

import "google/protobuf/timestamp.proto";

message EntityLink {
  string id = 1;
  string role = 2;
  string entity_type = 3;
  string entity_id = 4;
}

message TimelineEvent {
  string id = 1;
  string story_id = 2;
  string chapter_id = 3;
  int32 chapter_number = 4;
  int32 timeline_day = 5;
  string timeline_confidence = 6;
  bool has_timeline_day = 7;
  string description = 8;
  repeated EntityLink entities = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateTimelineEventRequest {
  string story_id = 1;
  string chapter_id = 2;
  int32 chapter_number = 3;
  int32 timeline_day = 4;
  string timeline_confidence = 5;
  bool has_timeline_day = 6;
  string description = 7;
  repeated EntityLink entities = 8;
}

message CreateTimelineEventResponse {
  TimelineEvent timeline_event = 1;
}

message GetTimelineEventRequest {
  string id = 1;
}

message GetTimelineEventResponse {
  TimelineEvent timeline_event = 1;
}

message ListTimelineEventsByStoryRequest {
  string story_id = 1;
  int32 as_of_chapter = 2;
  int32 limit = 3;
}

message ListTimelineEventsByStoryResponse {
  repeated TimelineEvent timeline_events = 1;
}

message ListTimelineEventsByChapterRequest {
  string chapter_id = 1;
}

message ListTimelineEventsByChapterResponse {
  repeated TimelineEvent timeline_events = 1;
}

message DeleteTimelineEventRequest {
  string id = 1;
}

message DeleteTimelineEventResponse {}

service TimelineEventService {
  rpc CreateTimelineEvent(CreateTimelineEventRequest) returns (CreateTimelineEventResponse);
  rpc GetTimelineEvent(GetTimelineEventRequest) returns (GetTimelineEventResponse);
  rpc ListTimelineEventsByStory(ListTimelineEventsByStoryRequest) returns (ListTimelineEventsByStoryResponse);
  rpc ListTimelineEventsByChapter(ListTimelineEventsByChapterRequest) returns (ListTimelineEventsByChapterResponse);
  rpc DeleteTimelineEvent(DeleteTimelineEventRequest) returns (DeleteTimelineEventResponse);
}
